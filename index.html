<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneScreen Write</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
  <canvas id="whiteboard"></canvas>

  <input type="file" id="importImgInput" accept="image/*" hidden>
  <input type="file" id="importPdfInput" accept="application/pdf" hidden>

  <div class="menu-popup" id="menuPopup">
    <button class="menu-item" id="menuNew"><i class="la la-file-medical"></i><span>New</span></button>
    <button class="menu-item" id="menuOpen"><i class="la la-folder-open"></i><span>Open</span></button>
    <button class="menu-item" id="menuSave"><i class="la la-save"></i><span>Save</span></button>
    <button class="menu-item" id="menuSaveAs"><i class="la la-save"></i><span>Save as</span></button>
    
    <div class="menu-item-group">
      <button class="menu-item" id="menuImport"><i class="la la-file-import"></i><span>Import</span><i class="la la-caret-right arrow"></i></button>
      <div class="submenu" id="importSubmenu">
        <button class="submenu-item" id="importImgBtn"><i class="la la-image"></i><span>IMG</span></button>
        <button class="submenu-item" id="importPdfBtn"><i class="la la-file-pdf"></i><span>PDF</span></button>
        <button class="submenu-item"><i class="la la-vector-square"></i><span>SVG</span></button>
        <button class="submenu-item"><i class="la la-file"></i><span>IWB</span></button>
      </div>
    </div>

    <button class="menu-item"><i class="la la-file-export"></i><span>Export</span><i class="la la-caret-right arrow"></i></button>
    <button class="menu-item"><i class="la la-cloud-upload-alt"></i><span>Cloud Storage</span><i class="la la-caret-right arrow"></i></button>
    <button class="menu-item" id="menuTheme"><i class="la la-border-all"></i><span>Theme</span></button>
    <button class="menu-item"><i class="la la-envelope"></i><span>Send Email</span></button>
    <button class="menu-item"><i class="la la-cog"></i><span>Settings</span></button>
  </div>

  <div class="object-toolbar" id="objectToolbar">
    <button class="obj-btn"><i class="la la-crop"></i><span>Crop</span></button>
    <button class="obj-btn"><i class="la la-vector-square"></i><span>SVG</span></button>
    <button class="obj-btn" id="btnFlipX"><i class="la la-arrows-alt-h"></i><span>Flip</span></button>
    <button class="obj-btn" id="btnLayerUp"><i class="la la-layer-group"></i><span>Top</span></button>
    <button class="obj-btn" id="btnLayerDown"><i class="la la-layer-group"></i><span>Bottom</span></button>
    <button class="obj-btn" id="btnClone"><i class="la la-clone"></i><span>Clone</span></button>
    <button class="obj-btn" id="btnDeleteObj"><i class="la la-trash"></i><span>Delete</span></button>
  </div>

  <div class="modal-overlay" id="themeModal">
    <div class="theme-card">
      <h2>Theme</h2>
      
      <div class="theme-tabs">
        <button class="theme-tab-btn active" id="tabTemplate">Template</button>
        <button class="theme-tab-btn" id="tabBackground">Background</button>
      </div>

      <div class="tab-content active" id="contentTemplate">
        <div class="template-grid">
          <div class="template-item active" data-template="none">
            <div class="tpl-preview empty-tpl">🚫</div>
          </div>
          <div class="template-item" data-template="ruled">
            <div class="tpl-preview ruled-lines"><div></div><div></div><div></div></div>
          </div>
          <div class="template-item" data-template="stave">
            <div class="tpl-preview stave-lines"><div></div><div></div><div></div><div></div></div>
          </div>
          <div class="template-item" data-template="grid">
            <div class="tpl-preview grid-box"></div>
          </div>
          <div class="template-item" data-template="dots">
            <div class="tpl-preview dots-box"></div>
          </div>
        </div>
      </div>

      <div class="tab-content" id="contentBackground">
        <p class="section-title">Color</p>
        <div class="bg-color-grid">
          <button class="bg-swatch active" data-color="#dcdfdc" style="background:#dcdfdc;"></button>
          <button class="bg-swatch" data-color="#ffffff" style="background:#ffffff;"></button>
          <button class="bg-swatch" data-color="#e2ece9" style="background:#e2ece9;"></button>
          <button class="bg-swatch" data-color="#64748b" style="background:#64748b;"></button>
          <button class="bg-swatch" data-color="#334155" style="background:#334155;"></button>
          <button class="bg-swatch" data-color="#0f172a" style="background:#0f172a;"></button>
          <button class="bg-swatch" data-color="#93c5fd" style="background:#93c5fd;"></button>
          <button class="bg-swatch" data-color="#86efac" style="background:#86efac;"></button>
          <button class="bg-swatch" data-color="#fef08a" style="background:#fef08a;"></button>
          <button class="bg-swatch" data-color="#fca5a5" style="background:#fca5a5;"></button>
          <button class="bg-swatch" data-color="#d8b4fe" style="background:#d8b4fe;"></button>
        </div>

        <p class="section-title">Image</p>
        <div class="bg-image-row">
          <div class="upload-btn-box">
            <input type="file" id="bgImageUpload" accept="image/*" hidden>
            <label for="bgImageUpload" class="upload-label"><i class="la la-plus"></i></label>
          </div>
          <div class="uploaded-images" id="uploadedImagesContainer"></div>
        </div>
      </div>

      <div class="theme-footer">
        <button class="btn-cancel" id="cancelTheme">Cancel</button>
        <button class="btn-ok" id="applyTheme">OK</button>
      </div>
    </div>
  </div>

  <div class="pen-popup" id="penPopup">
    <div class="pen-sidebar">
      <button class="pen-tab" data-tab="gesture"><i class="la la-hand-pointer"></i></button>
      <button class="pen-tab active" data-tab="pen1"><i class="la la-pen"></i></button>
      <button class="pen-tab" data-tab="pen2"><i class="la la-marker"></i></button>
    </div>

    <div class="pen-content">
      <div class="pen-toggle-row">
        <label class="switch">
          <input type="checkbox" id="fingerSelectToggle">
          <span class="slider round"></span>
        </label>
        <span class="toggle-label">Use fingers to select <i class="la la-question-circle"></i></span>
      </div>

      <div class="pen-types">
        <button class="pen-type-btn active" data-type="pencil"><i class="la la-pencil-alt"></i></button>
        <button class="pen-type-btn" data-type="brush"><i class="la la-paint-brush"></i></button>
        <button class="pen-type-btn" data-type="calligraphy"><i class="la la-pen-nib"></i></button>
        <button class="pen-type-btn" data-type="highlighter"><i class="la la-highlighter"></i></button>
        <button class="pen-type-btn" data-type="text-pen"><span class="ab-icon">AB</span></button>
        <button class="pen-type-btn" data-type="magic"><i class="la la-magic"></i></button>
      </div>

      <div class="pen-size-row">
        <input type="range" id="penSizeSlider" min="2" max="30" value="5">
      </div>

      <div class="color-grid">
        <button class="color-swatch" data-color="#ffffff" style="background:#ffffff; border:1px solid #ccc;"></button>
        <button class="color-swatch active" data-color="#000000" style="background:#000000;"></button>
        <button class="color-swatch" data-color="#e53935" style="background:#e53935;"></button>
        <button class="color-swatch" data-color="#fdd835" style="background:#fdd835;"></button>
        <button class="color-swatch" data-color="#fb8c00" style="background:#fb8c00;"></button>
        <button class="color-swatch" data-color="#f57c00" style="background:#f57c00;"></button>
        <button class="color-swatch" data-color="#7cb342" style="background:#7cb342;"></button>
        <button class="color-swatch" data-color="#43a047" style="background:#43a047;"></button>
        <button class="color-swatch" data-color="#00acc1" style="background:#00acc1;"></button>
        <button class="color-swatch" data-color="#d81b60" style="background:#d81b60;"></button>
        <button class="color-swatch" data-color="#8e24aa" style="background:#8e24aa;"></button>
        <button class="color-swatch rainbow-swatch"></button>
      </div>
    </div>
  </div>

  <div class="toolbar-wrapper">
    <div class="tool-card section-blue">
      <button class="tool-item action-btn" id="menuBtn" data-tool="menu"><i class="la la-bars"></i><span>Menu</span></button>
      <button class="tool-item action-btn" id="exitBtn" data-tool="exit"><i class="la la-sign-out-alt"></i><span>Exit</span></button>
      <button class="tool-item" data-tool="share"><i class="la la-qrcode"></i><span>Share</span></button>
      <button class="tool-item" data-tool="list"><i class="la la-list-ul"></i><span>List</span></button>
    </div>

    <div class="tool-card section-indigo">
      <button class="tool-item active" id="selectBtn" data-tool="select"><i class="la la-mouse-pointer"></i><span>Selection</span></button>

      <button class="tool-item" id="penBtn" data-tool="pen">
        <i class="la la-pencil-alt"></i>
        <span>Pen</span>
        <i class="la la-caret-right tool-arrow" id="penArrow"></i>
      </button>

      <button class="tool-item" id="eraserBtn" data-tool="eraser"><i class="la la-eraser"></i><span>Eraser</span></button>
      <button class="tool-item" data-tool="search"><i class="la la-search"></i><span>Search</span></button>
      <button class="tool-item action-btn" id="clearBtn" data-tool="clean"><i class="la la-file-excel"></i><span>Clean</span></button>
      <button class="tool-item" data-tool="ruler"><i class="la la-ruler-combined"></i><span>Ruler</span></button>
      <button class="tool-item" data-tool="shape"><i class="la la-shapes"></i><span>Shape</span></button>
      <button class="tool-item" data-tool="multiuser"><i class="la la-user-friends"></i><span>Multi User</span></button>
      <button class="tool-item" data-tool="browser"><i class="la la-globe"></i><span>Browser</span></button>
      <button class="tool-item" data-tool="mindmap"><i class="la la-sitemap"></i><span>Mind map</span></button>
      <button class="tool-item" data-tool="camera"><i class="la la-camera"></i><span>Camera</span></button>
      <button class="tool-item" data-tool="move"><i class="la la-hand-paper"></i><span>Move</span></button>
      <button class="tool-item" data-tool="formula"><i class="la la-calculator"></i><span>Formula</span></button>
      <button class="tool-item" data-tool="more"><i class="la la-ellipsis-h"></i><span>More</span></button>
      <button class="tool-item action-btn" id="undoBtn"><i class="la la-undo-alt"></i><span>Undo</span></button>
      <button class="tool-item action-btn" id="redoBtn"><i class="la la-redo-alt"></i><span>Redo</span></button>
    </div>

    <div class="tool-card section-indigo">
      <button class="tool-item action-btn" data-tool="add"><i class="la la-plus-circle"></i><span>Add</span></button>
      <button class="tool-item muted action-btn" id="prevPageBtn"><i class="la la-angle-left"></i><span>Previous</span></button>
      
      <div class="page-indicator">
        <span id="pageCounter">1/1</span>
        <span class="sub-label">Page</span>
      </div>

      <button class="tool-item muted action-btn" id="nextPageBtn"><i class="la la-angle-right"></i><span>Next</span></button>
      
      <button class="tool-item guru-btn action-btn">
        <img src="https://onescreensolutions.com/wp-content/uploads/2025/05/Guru-Help-1.svg" alt="Guru Support" class="guru-icon">
        <span>Support</span>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
