name: Fast APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build APK via Cordova
        run: |
          npm install -g cordova
          cordova create appcom com.onescreensolutions.write "OneScreen Write"
          cp index.html style.css app.js manifest.json appcom/www/ 2>/dev/null || cp index.html style.css app.js appcom/www/
          cd appcom
          cordova platform add android
          cordova build android --debug

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneScreenWrite
          path: appcom/platforms/android/app/build/outputs/apk/debug/app-debug.apk
